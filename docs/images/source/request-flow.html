<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MirbadLLM inference request flow</title>
  <meta name="illustration-theme" content="mirbadllm/light/remote">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;1,500&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f7f7f5;
      --color-ink:     #1e2226;
      --color-muted:   #5f676e;
      --color-accent:  #8a5a00;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
      --font-mono:     'Azeret Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1240px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1240px; display: block; }
  </style>
</head>

<desc id="request-flow-desc">An OpenAI-compatible request goes from the client to the master's router, which checks the API key, resolves the model's node and proxies over mTLS to that node's agent, which forwards it to the local model server and streams the server-sent events back.</desc>

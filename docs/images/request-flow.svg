<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 40 1240 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="request-flow-title request-flow-desc">
<title id="request-flow-title">MirbadLLM inference request flow</title>
<desc id="request-flow-desc">An OpenAI-compatible request goes from the client to the master's router, which checks the API key, resolves the model's node and proxies over mTLS to that node's agent, which forwards it to the local model server and streams the server-sent events back.</desc>

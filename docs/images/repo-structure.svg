<title id="repo-structure-title">MirbadLLM project structure</title>
<desc id="repo-structure-desc">The master project MirbadLLM.Web builds on Orchestration and Router, the node agent on NodeRuntime and Pki, and every project ends in the shared Agent.Contracts and Core libraries; tests, deploy, tools and docs folders sit beside src.</desc>

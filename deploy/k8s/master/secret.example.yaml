# Keys of the master's secret (NOT applied by kustomization.yaml; in the cluster it comes from Infisical). The CA here
# must be the one in /data/pki copied from the DGX (D63: a different CA stops the master), so the enrolled agents keep
# trusting the master after the move.
apiVersion: v1
kind: Secret
metadata:
  name: mirbadllm-master
  namespace: mirbadllm
type: Opaque
stringData:
  MirbadLLM__AdminPassword: CHANGE-ME
  MirbadLLM__ApiKey: ""
  MirbadLLM__Backup__Passphrase: CHANGE-ME
  MirbadLLM__Pki__CaCertPem: |
    -----BEGIN CERTIFICATE-----
    CHANGE-ME
    -----END CERTIFICATE-----
  MirbadLLM__Pki__CaKeyPem: |
    -----BEGIN PRIVATE KEY-----
    CHANGE-ME
    -----END PRIVATE KEY-----
